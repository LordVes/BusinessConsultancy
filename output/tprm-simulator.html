<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: slim header with simulated clock, tab navigation, content in one column up to 1080px.
   Treatment: utilitarian risk-desk tool; petrol accent, cool blue-grey neutrals, mono for data. */
:root {
  --bg: #f2f5f6; --surface: #ffffff; --ink: #14232b; --muted: #55676f; --line: #d3dce0; --line-soft: #e6ecee;
  --accent: #0f6b73; --accent-ink: #ffffff; --accent-soft: #dbeeee;
  --ok: #1d7648; --ok-soft: #dff1e6; --warn: #8f5508; --warn-soft: #f8ead2; --bad: #ad2a22; --bad-soft: #f8dedb;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e181d; --surface: #152329; --ink: #e5eef0; --muted: #94a8af; --line: #2a3b42; --line-soft: #213138;
    --accent: #55bcc4; --accent-ink: #072226; --accent-soft: #163a3f;
    --ok: #62c694; --ok-soft: #173a2a; --warn: #e4a550; --warn-soft: #3d2f14; --bad: #ff8f86; --bad-soft: #43201d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e181d; --surface: #152329; --ink: #e5eef0; --muted: #94a8af; --line: #2a3b42; --line-soft: #213138;
  --accent: #55bcc4; --accent-ink: #072226; --accent-soft: #163a3f;
  --ok: #62c694; --ok-soft: #173a2a; --warn: #e4a550; --warn-soft: #3d2f14; --bad: #ff8f86; --bad-soft: #43201d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--sans); }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
h1 { font-size: 20px; letter-spacing: -0.01em; }
h2 { font-size: 18px; margin-bottom: 12px; }
h3 { font-size: 14px; margin-bottom: 8px; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 500 11px/1.2 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; padding-bottom: 14px; }
.brand { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.clock { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.clock .date { font: 500 15px var(--mono); padding: 4px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
nav.tabs button, .subtabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; color: var(--muted); white-space: nowrap; font-weight: 500; }
nav.tabs button[aria-current="true"], .subtabs button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.subtabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin: 16px 0; }

.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; }
.flash { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 8px 12px; margin-bottom: 16px; }
.flash.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
.kpi { background: var(--surface); padding: 12px 14px; }
.kpi b { display: block; font: 500 26px/1.1 var(--mono); margin-top: 4px; }
.kpi.alert b { color: var(--bad); }

.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 24px; gap: 8px; align-items: center; font-size: 12px; }
.bar .track { height: 10px; background: var(--line-soft); border-radius: 2px; }
.bar .fill { height: 100%; background: var(--accent); border-radius: 2px; }
.bar span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 640px; }
th { text-align: left; font: 500 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
td { padding: 8px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--accent-soft); }

.pill { display: inline-block; font: 500 11px/1 var(--mono); padding: 3px 7px; border-radius: 3px; border: 1px solid var(--line); white-space: nowrap; }
.pill.t1 { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pill.t2 { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); }
.pill.t3 { background: transparent; color: var(--muted); }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.mute { color: var(--muted); }

.steps { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin: 14px 0 0; padding: 0; list-style: none; }
.steps li { border-top: 3px solid var(--line); padding-top: 4px; font-size: 11px; line-height: 1.25; color: var(--muted); min-width: 0; }
.steps li.done { border-color: var(--ok); }
.steps li.cur { border-color: var(--accent); color: var(--ink); font-weight: 600; }
.steps li .n { font-family: var(--mono); display: block; }
@media (max-width: 720px) { .steps { grid-template-columns: repeat(5, 1fr); row-gap: 10px; } }

.stage { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); margin-bottom: 8px; }
.stage > button { width: 100%; text-align: left; background: none; border: 0; padding: 10px 14px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.stage.cur { border-color: var(--accent); }
.stage .body { padding: 0 14px 12px; }
.task { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; }
.task input { margin-top: 3px; accent-color: var(--accent); }
.task.auto .mark { width: 13px; text-align: center; font-family: var(--mono); }

.field { display: grid; gap: 4px; margin-bottom: 12px; min-width: 0; }
.field label, .field .lab { font-weight: 500; }
.field input[type=text], .field select, .field textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; width: 100%; }
.field textarea { min-height: 70px; font-family: var(--mono); font-size: 12px; }
.slider { display: grid; grid-template-columns: 1fr 24px; gap: 8px; align-items: center; }
.slider input { accent-color: var(--accent); width: 100%; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.checks label { display: flex; gap: 6px; align-items: center; font-weight: 400; }
.checks input { accent-color: var(--accent); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 0 16px; }
details.panel > summary { cursor: pointer; font-weight: 600; }
details.panel[open] > summary { margin-bottom: 12px; }

.req { padding: 10px 0; border-bottom: 1px solid var(--line-soft); display: grid; gap: 4px; }
.req:last-child { border-bottom: 0; }
.req .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.issue { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; background: var(--surface); }
.issue.open { border-left: 4px solid var(--bad); }
pre.out { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 var(--mono); }
footer { margin-top: 32px; color: var(--muted); font-size: 12px; max-width: 70ch; }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .3s; } }
</style>

/* ------------------------------------------------------------------ helpers */
const FACTORS = Object.keys(CFG.scoring.factors);
const FRAMEWORKS = Object.keys(CFG.frameworks);
const ALL_TASKS = CFG.stages.flatMap(s => s.tasks.map(t => ({ ...t, stage: s.id })));
const STAGE_COUNT = CFG.stages.length;
const MONITORING_STAGE = CFG.stages.find(s => s.name === 'Ongoing monitoring').id;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const fd = d => d.toISOString().slice(0, 10);
function addMonths(s, n) {
  const d = pd(s), t = d.getUTCMonth() + n;
  const y = d.getUTCFullYear() + Math.floor(t / 12), m = ((t % 12) + 12) % 12;
  const last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  return fd(new Date(Date.UTC(y, m, Math.min(d.getUTCDate(), last))));
}

/* ------------------------------------------------------------------ scoring */
const inherentScore = v => +FACTORS.reduce((a, k) => a + CFG.scoring.factors[k].weight * Number(v[k]), 0).toFixed(2);
function overrideMatches(when, v) {
  return Object.entries(when).every(([k, exp]) => k.endsWith('_gte') ? Number(v[k.slice(0, -4)] || 0) >= exp : !!v[k] === !!exp);
}
function assignTier(v) {
  const score = inherentScore(v), th = CFG.scoring.tier_thresholds;
  let tier = score >= th.tier1 ? 1 : score >= th.tier2 ? 2 : 3;
  const reasons = [`Weighted inherent score ${score.toFixed(2)} gives Tier ${tier} (Tier 1 at ${th.tier1}+, Tier 2 at ${th.tier2}+).`];
  for (const r of CFG.scoring.overrides) {
    if (overrideMatches(r.when, v) && tier > r.min_tier) { tier = r.min_tier; reasons.push(`Override "${r.id}" sets Tier ${tier}: ${r.reason}`); }
  }
  return { tier, score, reasons };
}
const RATINGS = CFG.scoring.residual.ratings.map(r => r.name);
const ratingFor = s => (CFG.scoring.residual.ratings.find(r => s < r.below) || CFG.scoring.residual.ratings.at(-1)).name;
const rank = n => RATINGS.indexOf(n);
function residual(inherent, share, points) {
  const r = CFG.scoring.residual;
  const s = Math.min(inherent * (1 - r.dd_mitigation_max * share) + r.residual_per_severity_point * points, 4);
  const score = Math.round(s * 100) / 100;
  return { score, rating: ratingFor(score) };
}
const healthFor = p => (CFG.monitoring.health.find(h => p <= h.max_points) || CFG.monitoring.health.at(-1)).name;

/* ------------------------------------------------------------------ rules */
const nextDue = v => addMonths(v.lastAssessed, CFG.monitoring.reassessment_months[v.tier]);
function autoDone(rule, v) {
  if (rule === 'no_open_issues') return !v.events.some(e => !e.closedOn);
  if (rule === 'reassessment_current') return !v.flag && nextDue(v) >= S.simDate;
  if (rule === 'notifications_done') return v.events.filter(e => e.notifyRequired).every(e => e.notified);
  throw new Error(rule);
}
function taskApplies(t, v, rating) {
  if (!t.tiers.includes(v.tier)) return false;
  if ((t.requires || []).some(f => !v[f])) return false;
  return !(t.when_residual_at_least && rank(rating) < rank(t.when_residual_at_least));
}
const taskStatus = (v, rating) => ALL_TASKS.filter(t => taskApplies(t, v, rating)).map(t => ({ ...t, done: t.auto ? autoDone(t.auto, v) : !!v.done[t.id] }));
function reqApplies(r, v) { return v.regimes.includes(r.framework) && r.tiers.includes(v.tier) && (r.requires || []).every(f => v[f]); }
function gapsFor(v, tasks) {
  return CFG.requirements.filter(r => reqApplies(r, v)).map(r => {
    const ts = tasks.filter(t => (t.satisfies || []).includes(r.id));
    let state = 'Unmapped';
    if (ts.length) state = ts.every(t => t.done) ? 'Met' : ts.some(t => !t.done && t.stage <= v.stage) ? 'Open' : 'Upcoming';
    return { ...r, state, tasks: ts };
  });
}
function view(v) {
  const points = v.events.filter(e => !e.closedOn).reduce((a, e) => a + e.severity, 0);
  let rating = ratingFor(v.inherent), tasks, share = 0, res = { score: v.inherent, rating };
  for (let i = 0; i < 4; i++) {
    tasks = taskStatus(v, rating);
    const dd = tasks.filter(t => t.stage === 3);
    share = dd.length ? dd.filter(t => t.done).length / dd.length : 0;
    res = residual(v.inherent, share, points);
    if (res.rating === rating) break;
    rating = res.rating;
  }
  const due = nextDue(v);
  return {
    ...v, tasks, share, points, residualScore: res.score, rating, health: healthFor(points), due, overdue: due < S.simDate,
    blocking: tasks.filter(t => t.stage <= v.stage && !t.done), gaps: gapsFor(v, tasks), tierReasons: assignTier(v).reasons,
  };
}
const allViews = () => S.vendors.map(view);
const stageName = v => v.exited ? 'Exited' : `${v.stage}. ${CFG.stages[v.stage - 1].name}`;
function notificationsFor(v, kind) {
  return (CFG.events[kind].notify || []).filter(n => v.regimes.includes(n.framework) && !(n.framework === 'DORA' && !v.ict_service));
}

  return [`# TPRM vendor report - ${v.name}`, '', `_${CFG.meta.disclaimer.trim()}_`, '', `- Simulated date: ${S.simDate}`, `- Tier: ${v.tier} (inherent score ${v.inherent.toFixed(2)})`,
    `- Stage: ${stageName(v)}`, `- Residual risk: ${v.rating} (${v.residualScore.toFixed(2)})`, `- Health: ${v.health}`, `- Next reassessment due: ${v.due}`, `- Regimes in scope: ${v.regimes.join(', ') || 'none'}`, '',
    '## Tiering rationale', ...v.tierReasons.map(r => `- ${r}`), '', '## Tasks', ...v.tasks.map(t => `- [${t.done ? 'x' : ' '}] S${t.stage} ${t.text}`), '',
    '## Regulatory coverage', '', '| Framework | Ref | State |', '|---|---|---|', ...v.gaps.map(g => `| ${g.framework} | ${g.ref} | ${g.state} |`), '',
    '## Issues', ...(v.events.length ? v.events.map(e => `- ${e.openedOn} ${e.label} - ${e.resolution || 'OPEN'}`) : ['- none'])].join('\n') + '\n';
}

/* ------------------------------------------------------------------ views */
const tierPill = t => `<span class="pill t${t}">Tier ${t}</span>`;
const healthPill = h => `<span class="pill ${{ Healthy: 'ok', Watch: 'warn', 'At risk': 'warn', Critical: 'bad' }[h]}">${h}</span>`;
const ratingPill = r => `<span class="pill ${{ Low: 'ok', Medium: 'warn', High: 'bad', Critical: 'bad' }[r]}">${r}</span>`;
const statePill = s => `<span class="pill ${{ Met: 'ok', Open: 'bad', Upcoming: 'mute', Unmapped: 'warn' }[s]}">${s}</span>`;
const bars = (items, max) => `<div class="bars">${items.map(([l, n]) => `<div class="bar"><span title="${esc(l)}">${esc(l)}</span><div class="track"><div class="fill" style="width:${max ? (n / max) * 100 : 0}%"></div></div><span class="num">${n}</span></div>`).join('')}</div>`;
const copyBox = (id, text, label) => `<div class="field"><span class="lab">${label}</span><textarea id="${id}" readonly rows="6">${esc(text)}</textarea><div><button class="btn sm" data-a="copy" data-target="${id}">Copy to clipboard</button></div></div>`;

function pageDash() {
  const vs = allViews();
  if (!vs.length) return `<div class="panel"><h2>No vendors yet</h2><p class="muted">Load four fictional sample vendors to see the lifecycle in action, or add your own on the Vendors page.</p><button class="btn primary" data-a="loadSamples">Load sample vendors</button></div>`;
  const act = vs.filter(v => !v.exited);
  const openIssues = act.reduce((a, v) => a + v.events.filter(e => !e.closedOn).length, 0);
  const openGaps = act.reduce((a, v) => a + v.gaps.filter(g => g.state === 'Open').length, 0);
  const overdue = act.filter(v => v.overdue).length;
  const byStage = CFG.stages.map(s => [`${s.id}. ${s.name}`, act.filter(v => v.stage === s.id).length]);
  const byTier = [1, 2, 3].map(t => [`Tier ${t}`, act.filter(v => v.tier === t).length]);
  const max = Math.max(1, ...byStage.map(x => x[1]), ...byTier.map(x => x[1]));
  return `
  <div class="kpis">
    <div class="kpi"><span class="eyebrow">Active vendors</span><b>${act.length}</b></div>
    <div class="kpi"><span class="eyebrow">Tier 1</span><b>${act.filter(v => v.tier === 1).length}</b></div>
    <div class="kpi ${overdue ? 'alert' : ''}"><span class="eyebrow">Overdue reviews</span><b>${overdue}</b></div>
    <div class="kpi ${openIssues ? 'alert' : ''}"><span class="eyebrow">Open issues</span><b>${openIssues}</b></div>
    <div class="kpi ${openGaps ? 'alert' : ''}"><span class="eyebrow">Open reg. gaps</span><b>${openGaps}</b></div>
  </div>
  <div class="grid g2" style="margin-bottom:16px">
    <div class="panel"><h3>Vendors by lifecycle stage</h3>${bars(byStage, max)}</div>
    <div class="panel"><h3>Vendors by tier</h3>${bars(byTier, max)}</div>
  </div>
  <div class="panel scroll"><h3>Vendor overview</h3>
    <table><thead><tr><th>Vendor</th><th>Tier</th><th>Stage</th><th>Residual</th><th>Health</th><th>Next review</th><th>Open gaps</th></tr></thead><tbody>
    ${vs.map(v => `<tr class="click" data-a="openVendor" data-id="${v.id}"><td><b>${esc(v.name)}</b></td><td>${tierPill(v.tier)}</td><td>${esc(stageName(v))}</td><td>${ratingPill(v.rating)} <span class="num muted">${v.residualScore.toFixed(2)}</span></td><td>${healthPill(v.health)}</td><td class="num">${v.due}${v.overdue ? ' <span class="pill bad">overdue</span>' : ''}</td><td class="num">${v.gaps.filter(g => g.state === 'Open').length}</td></tr>`).join('')}
    </tbody></table></div>
  <details class="panel" style="margin-top:16px"><summary>Register of Information (simplified DORA-style CSV)</summary>
    <p class="muted small">Covers ICT-service vendors only. Not the official supervisory template.</p>${copyBox('reg-csv', registerCsv(vs), 'CSV')}</details>`;
}
A.openVendor = el => { UI.vid = Number(el.dataset.id); UI.page = 'vendor'; UI.tab = 'workflow'; UI.open = {}; };

function newVendorForm() {
  return `<details class="panel" style="margin-bottom:16px" ${UI.newOpen ? 'open' : ''}><summary>Add a vendor</summary>
  <div class="fgrid">
    <div class="field"><label for="nv-name">Vendor name (use fictional names)</label><input type="text" id="nv-name"></div>
    <div class="field"><label for="nv-type">Type</label><select id="nv-type">${['Claims TPA', 'MGA / delegated authority', 'Cloud / core system', 'Offshore BPO', 'Data provider', 'Broker', 'Other'].map(t => `<option>${t}</option>`).join('')}</select></div>
    <div class="field"><label for="nv-country">Country</label><input type="text" id="nv-country" value="UK"></div>
  </div>
  <div class="field"><label for="nv-desc">Service description</label><input type="text" id="nv-desc"></div>
  <div class="checks" style="margin-bottom:12px"><label><input type="checkbox" id="nv-ict"> ICT service (DORA scope)</label><label><input type="checkbox" id="nv-crit"> Supports a critical or important function</label></div>
  <div class="field"><span class="lab">Regulatory regimes in scope</span><div class="checks">${FRAMEWORKS.map(f => `<label title="${esc(CFG.frameworks[f])}"><input type="checkbox" id="nv-reg-${f}"> ${f}</label>`).join('')}</div></div>
  <div class="fgrid">${FACTORS.map(k => sliderField('nv-f-' + k, k, 2)).join('')}</div>
  <button class="btn primary" data-a="createVendor">Create vendor</button></details>`;
}
function sliderField(id, k, val) {
  const f = CFG.scoring.factors[k];
  return `<div class="field"><label for="${id}">${f.label} <span class="muted small">(weight ${Math.round(f.weight * 100)}%)</span></label><div class="slider"><input type="range" min="1" max="4" step="1" id="${id}" value="${val}" aria-describedby="${id}-h"><output class="num">${val}</output></div><span class="muted small" id="${id}-h">${esc(f.help)}</span></div>`;
}

function stageTracker(v) {
  return `<ol class="steps">${CFG.stages.map(s => `<li class="${v.exited || s.id < v.stage ? 'done' : s.id === v.stage ? 'cur' : ''}"><span class="n">${String(s.id).padStart(2, '0')}</span>${esc(s.name)}</li>`).join('')}</ol>`;
}

function tabWorkflow(v) {
  const stages = CFG.stages.map(s => {
    const ts = v.tasks.filter(t => t.stage === s.id);
    if (!ts.length) return '';
    const done = ts.filter(t => t.done).length, cur = s.id === v.stage && !v.exited, fut = s.id > v.stage && !v.exited;
    const open = UI.open[s.id] ?? cur;
    const back = done < ts.length && s.id < v.stage ? ' <span class="pill warn">backfill</span>' : '';
    return `<div class="stage ${cur ? 'cur' : ''}"><button data-a="toggleStage" data-id="${s.id}" aria-expanded="${open}"><span class="eyebrow">Stage ${s.id}</span><b>${esc(s.name)}</b><span class="num muted">${done}/${ts.length}</span>${back}</button>
    ${open ? `<div class="body"><p class="muted small">${esc(s.line)} · ${esc(s.description)}</p>${ts.map(t => t.auto
      ? `<div class="task auto"><span class="mark" style="color:var(--${t.done ? 'ok' : 'muted'})">${t.done ? '✓' : '○'}</span><span>${esc(t.text)} <span class="pill mute">automatic</span></span></div>`
      : `<label class="task"><input type="checkbox" data-a="task" data-id="${t.id}" ${t.done ? 'checked' : ''} ${fut || v.exited ? 'disabled' : ''}><span>${esc(t.text)}${t.when_residual_at_least ? ` <span class="pill warn">residual ${t.when_residual_at_least}+</span>` : ''}</span></label>`).join('')}</div>` : ''}</div>`;
  }).join('');
  const last = v.stage === STAGE_COUNT;
  return `${v.exited ? '<div class="flash ok">Lifecycle complete: this vendor has exited.</div>' : ''}${stages}
  ${v.exited ? '' : `<div class="row" style="margin-top:12px"><button class="btn primary" data-a="advance" ${v.blocking.length ? 'disabled' : ''}>${last ? 'Complete lifecycle (exit vendor)' : 'Advance to next stage'}</button>
  ${v.blocking.length ? `<span class="muted">${v.blocking.length} task(s) in the current or earlier stages still block this step.</span>` : '<span class="muted">All gate tasks are done.</span>'}</div>`}`;
}

function tabRisk(v) {
  return `<div class="kpis"><div class="kpi"><span class="eyebrow">Inherent score</span><b>${v.inherent.toFixed(2)}<span class="muted small"> / 4</span></b></div>
  <div class="kpi"><span class="eyebrow">Tier</span><b>${v.tier}</b></div>
  <div class="kpi"><span class="eyebrow">Residual risk</span><b>${v.rating}</b><span class="num muted small">${v.residualScore.toFixed(2)}</span></div></div>
  <div class="panel" style="margin-bottom:16px"><h3>Why this tier</h3><ul style="margin:0;padding-left:18px">${v.tierReasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
  <p class="muted small" style="margin-top:8px">Residual = inherent reduced by completed due diligence (${Math.round(v.share * 100)}% done), raised by open issues (${v.points} severity points).</p></div>
  <div class="panel"><h3>Change risk factors (re-tiers the vendor)</h3>
  <div class="fgrid">${FACTORS.map(k => sliderField('rk-f-' + k, k, v[k])).join('')}</div>
  <div class="checks" style="margin-bottom:12px"><label><input type="checkbox" id="rk-ict" ${v.ict_service ? 'checked' : ''}> ICT service (DORA scope)</label><label><input type="checkbox" id="rk-crit" ${v.critical_function ? 'checked' : ''}> Supports a critical or important function</label></div>
  <div class="field"><span class="lab">Regulatory regimes in scope</span><div class="checks">${FRAMEWORKS.map(f => `<label title="${esc(CFG.frameworks[f])}"><input type="checkbox" id="rk-reg-${f}" ${v.regimes.includes(f) ? 'checked' : ''}> ${f}</label>`).join('')}</div></div>
  <button class="btn primary" data-a="rescore">Re-score</button></div>`;
}

function tabReg(v) {
  if (!v.gaps.length) return '<div class="panel muted">No regulatory regimes are selected for this vendor. Add some on the Risk tab.</div>';
  const cnt = s => v.gaps.filter(g => g.state === s).length;
  const fws = [...new Set(v.gaps.map(g => g.framework))];
  const rows = v.gaps.filter(g => !UI.regFilter || g.framework === UI.regFilter);
  return `<div class="kpis">${['Met', 'Open', 'Upcoming', 'Unmapped'].map(s => `<div class="kpi ${s === 'Open' && cnt(s) ? 'alert' : ''}"><span class="eyebrow">${s}</span><b>${cnt(s)}</b></div>`).join('')}</div>
  <p class="muted small">Open: the evidencing task is in the current or an earlier stage and not done. Upcoming: evidence is due in a later stage.</p>
  <div class="field" style="max-width:260px"><label for="regf">Framework</label><select id="regf" data-a="regFilter"><option value="">All</option>${fws.map(f => `<option ${UI.regFilter === f ? 'selected' : ''}>${f}</option>`).join('')}</select></div>
  <div class="panel">${rows.map(g => `<div class="req"><div class="head">${statePill(g.state)}<b>${g.framework}</b><span class="mono muted small">${esc(g.ref)}</span></div><div>${esc(g.text)}</div>
  <div class="muted small">${g.tasks.map(t => `${t.done ? '✓' : '○'} ${esc(t.text)}`).join('<br>')}</div></div>`).join('')}</div>`;
}
A.regFilter = el => { UI.regFilter = el.value; };

function tabMon(v) {
  const months = CFG.monitoring.reassessment_months[v.tier];
  const kind = $('#ev-kind')?.value || Object.keys(CFG.events)[0];
  const note = $('#ev-note')?.value || '';
  return `<div class="kpis"><div class="kpi"><span class="eyebrow">Health</span><b style="font-size:18px">${healthPill(v.health)}</b></div>
  <div class="kpi"><span class="eyebrow">Cadence</span><b style="font-size:18px">${months} months</b></div>
  <div class="kpi ${v.overdue ? 'alert' : ''}"><span class="eyebrow">Next review</span><b style="font-size:18px">${v.due}</b></div>
  <div class="kpi"><span class="eyebrow">Last assessed</span><b style="font-size:18px">${v.lastAssessed}</b></div></div>
  ${v.flag ? '<div class="flash">A recent event triggered an out-of-cycle reassessment.</div>' : ''}
  <div class="row" style="margin-bottom:16px"><button class="btn" data-a="reassess">Record reassessment</button><span class="muted small">Resets the review clock and clears any trigger.</span></div>
  <div class="panel" style="margin-bottom:16px"><h3>Inject a test event</h3>
  <div class="field"><label for="ev-kind">Event</label><select id="ev-kind" data-a="evKind">${Object.entries(CFG.events).map(([k, e]) => `<option value="${k}" ${k === kind ? 'selected' : ''}>${esc(e.label)} (severity ${e.severity})</option>`).join('')}</select></div>
  <div class="field"><label for="ev-note">Note (optional)</label><input type="text" id="ev-note" value="${esc(note)}"></div>
  ${notificationsFor(v, kind).map(n => `<p class="small muted"><b>${n.framework}:</b> ${esc(n.text)}${n.deadline_hours ? ` (within ${n.deadline_hours}h)` : ''}</p>`).join('')}
  <button class="btn primary" data-a="addEvent">Inject event</button></div>
  <h3>Issues</h3>${v.events.length ? [...v.events].reverse().map(e => `<div class="issue ${e.closedOn ? '' : 'open'}"><div class="row"><b>${esc(e.label)}</b><span class="muted small">opened ${e.openedOn} · severity ${e.severity}</span>${e.closedOn ? `<span class="pill ok">${e.resolution} ${e.closedOn}</span>` : '<span class="pill bad">open</span>'}</div>
  ${e.note ? `<p class="muted small">${esc(e.note)}</p>` : ''}
  <div class="row" style="margin-top:6px">${e.notifyRequired ? `<label class="row small"><input type="checkbox" data-a="notify" data-id="${e.id}" ${e.notified ? 'checked' : ''}> Supervisory notification made</label>` : ''}
  ${e.closedOn ? '' : `<button class="btn sm" data-a="closeEvent" data-id="${e.id}" data-res="Remediated">Mark remediated</button><button class="btn sm" data-a="closeEvent" data-id="${e.id}" data-res="Risk accepted">Accept risk</button>`}</div></div>`).join('') : '<p class="muted">No issues yet.</p>'}`;
}
A.evKind = () => 'keepnote';

function auditTable(rows) {
  return `<div class="scroll panel"><table><thead><tr><th>Date</th><th>Vendor</th><th>Action</th><th>Detail</th></tr></thead><tbody>${rows.length ? rows.map(a => `<tr><td class="num">${a.date}</td><td>${esc(vendorById(a.vid)?.name ?? '-')}</td><td>${esc(a.action)}</td><td class="muted">${esc(a.detail)}</td></tr>`).join('') : '<tr><td colspan="4" class="muted">Nothing logged yet.</td></tr>'}</tbody></table></div>`;
}
function tabReport(v) {
  return `${copyBox('md-report', vendorMd(v), 'Vendor report (Markdown)')}<h3>Audit trail for this vendor</h3>${auditTable(S.audit.filter(a => a.vid === v.id).reverse())}
  <details class="panel" style="margin-top:16px"><summary>Test tools</summary><p class="muted small">Ticks every manual task before Ongoing monitoring so you can test events and reassessment quickly.</p><button class="btn" data-a="fastForward">Fast-forward to Ongoing monitoring</button></details>`;
}

function pageVendor() {
  const vs = allViews();
  if (!vs.length) return newVendorForm() + '<div class="panel muted">No vendors yet. Add one above or load the samples on the Setup page.</div>';
  if (!vs.some(v => v.id === UI.vid)) UI.vid = vs[0].id;
  const v = vs.find(x => x.id === UI.vid);
  const tabs = [['workflow', 'Workflow'], ['risk', 'Risk & tiering'], ['reg', 'Regulatory coverage'], ['mon', 'Monitoring & issues'], ['report', 'Report & audit']];
  const body = { workflow: tabWorkflow, risk: tabRisk, reg: tabReg, mon: tabMon, report: tabReport }[UI.tab](v);
  return `${newVendorForm()}
  <div class="field" style="max-width:420px"><label for="vsel">Vendor</label><select id="vsel" data-a="selectVendor">${vs.map(x => `<option value="${x.id}" ${x.id === v.id ? 'selected' : ''}>${esc(x.name)} - Tier ${x.tier}</option>`).join('')}</select></div>
  <div class="panel"><div class="row" style="justify-content:space-between"><div style="min-width:0"><h2 style="margin:0">${esc(v.name)}</h2><span class="muted">${esc(v.vtype)} · ${esc(v.country)} · ${esc(v.description)}</span></div>
  <div class="row">${tierPill(v.tier)}${ratingPill(v.rating)}${healthPill(v.health)}</div></div>${stageTracker(v)}</div>
  <div class="subtabs" role="tablist">${tabs.map(([k, l]) => `<button data-a="tab" data-v="${k}" aria-current="${UI.tab === k}">${l}</button>`).join('')}</div>${body}`;
}

function pageMap() {
  const by = {}; ALL_TASKS.forEach(t => (t.satisfies || []).forEach(r => (by[r] = by[r] || []).push(`Stage ${t.stage}: ${t.text}`)));
  const rows = CFG.requirements.filter(r => !UI.mapFilter || r.framework === UI.mapFilter);
  return `<p class="muted" style="max-width:70ch">${esc(CFG.meta.disclaimer.trim())}</p>
  <div class="field" style="max-width:340px"><label for="mapf">Framework</label><select id="mapf" data-a="mapFilter"><option value="">All frameworks</option>${FRAMEWORKS.map(f => `<option value="${f}" ${UI.mapFilter === f ? 'selected' : ''}>${f} - ${esc(CFG.frameworks[f])}</option>`).join('')}</select></div>
  <div class="panel">${rows.map(r => `<div class="req"><div class="head"><b>${r.framework}</b><span class="mono muted small">${esc(r.ref)}</span><span class="pill mute">Tiers ${r.tiers.join(', ')}</span>${(r.requires || []).map(f => `<span class="pill mute">${f}</span>`).join('')}</div><div>${esc(r.text)}</div><div class="muted small">${(by[r.id] || []).map(esc).join('<br>')}</div></div>`).join('')}</div>`;
}
A.mapFilter = el => { UI.mapFilter = el.value; };

function pageAudit() {
  return `${auditTable([...S.audit].reverse())}<div style="margin-top:16px">${copyBox('audit-csv', auditCsv(), 'Audit log (CSV)')}</div>`;
}

function pageSetup() {
  const th = CFG.scoring.tier_thresholds;
  return `<div class="grid g2">
  <div class="panel"><h3>Data</h3><p class="muted">Vendors and the audit log are stored in this browser only. Everything here is fictional sample data.</p>
  <div class="row"><button class="btn primary" data-a="loadSamples">Load 4 sample vendors</button>
  <button class="btn danger" data-a="reset">${UI.confirmReset ? 'Click again to delete everything' : 'Reset all data'}</button></div></div>
  <div class="panel"><h3>Backup and restore</h3><p class="muted small">Copy this text somewhere safe. Paste it back below to restore it, for example on another device.</p>
  ${copyBox('backup-out', JSON.stringify(S), 'Backup (JSON)')}
  <div class="field"><label for="backup-in">Restore from backup</label><textarea id="backup-in" placeholder="Paste backup JSON here"></textarea></div><button class="btn" data-a="import">Restore</button></div></div>
  <div class="panel" style="margin-top:16px"><h3>Scoring model</h3><div class="scroll"><table><thead><tr><th>Factor</th><th>Weight</th><th>Scale</th></tr></thead><tbody>${FACTORS.map(k => `<tr><td>${CFG.scoring.factors[k].label}</td><td class="num">${Math.round(CFG.scoring.factors[k].weight * 100)}%</td><td class="muted">${esc(CFG.scoring.factors[k].help)}</td></tr>`).join('')}</tbody></table></div>
  <p class="muted small" style="margin-top:8px">Tier 1 at ${th.tier1}+, Tier 2 at ${th.tier2}+, otherwise Tier 3. Overrides: ${CFG.scoring.overrides.map(o => esc(o.reason)).join(' ')}</p></div>`;
}

/* ------------------------------------------------------------------ render */
const PAGES = [['dash', 'Dashboard', pageDash], ['vendor', 'Vendors', pageVendor], ['map', 'Regulatory map', pageMap], ['audit', 'Audit log', pageAudit], ['setup', 'Setup', pageSetup]];
function render() {
  $('#clock').innerHTML = `<span class="eyebrow">Simulated date</span><span class="date">${S.simDate}</span>${[[1, '+1 month'], [6, '+6 months'], [12, '+1 year']].map(([m, l]) => `<button class="btn sm" data-a="advTime" data-m="${m}" title="Move the simulated clock forward to test reassessment cycles">${l}</button>`).join('')}`;
  $('#nav').innerHTML = PAGES.map(([k, l]) => `<button data-a="nav" data-v="${k}" aria-current="${UI.page === k}">${l}</button>`).join('');
  const f = UI.flash ? `<div class="flash ${UI.flash.ok ? 'ok' : ''}" role="status">${esc(UI.flash.msg)}</div>` : '';
  $('#app').innerHTML = f + PAGES.find(p => p[0] === UI.page)[2]();
  $('#foot').textContent = CFG.meta.disclaimer.trim();
}
function act(el) {
  const fn = A[el.dataset.a];
  if (!fn) return;
  if (!['copy', 'evKind'].includes(el.dataset.a)) UI.flash = null;
  if (fn(el) === 'norender') return;
  save(); render();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.matches('input[type=checkbox], select, textarea')) return;
  act(el);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-a]');
  if (el && el.matches('input[type=checkbox], select')) act(el);
});
document.addEventListener('input', e => {
  if (e.target.matches('input[type=range]')) e.target.parentElement.querySelector('output').textContent = e.target.value;
});

if (!S.seeded && !S.vendors.length) { loadSamples(); save(); }
render();
</script>
